name: Build iOS IPA (unsigned)

# Builds an UNSIGNED .ipa for sideloading via SideStore/AltStore and publishes
# it (with a SideStore source.json) to this repo's "latest" release.
# SideStore re-signs the app on your device with your own Apple ID, so no Apple
# Developer account or signing certificate is needed here.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "icons/**"
      - "assets/**"
      - "manifest.webmanifest"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "plugins/**"
      - "scripts/**"
      - ".github/workflows/build-ios.yml"

permissions:
  contents: write           # publish the release on this repo

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Foundation Models (on-device AI) needs the iOS 26 SDK. Pick the newest
      # Xcode on the runner; the plugin's canImport guards keep the build green
      # if the SDK still isn't there.
      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Stage web assets
        run: npm run stage

      - name: Add iOS platform
        run: npx cap add ios

      # Generate the native iOS AppIcon (and launch screen) from assets/icon.png.
      # Without this, `cap add ios` leaves Capacitor's default placeholder icon,
      # which is why the home-screen icon never changed before.
      - name: Generate native app icons
        run: npx @capacitor/assets generate --ios

      - name: Sync web assets into iOS project
        run: npx cap sync ios

      - name: Add required Info.plist permission strings
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Used to scan food barcodes.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Used to save progress photos.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Used to attach meal and progress photos.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSHealthShareUsageDescription string 'Used to sync your weight, steps, and sleep from Apple Health.'" "$PLIST" || true

      # HealthKit needs its own entitlement (separate from an Info.plist string).
      # ios/ is regenerated fresh every run (gitignored), so this can't just be
      # committed once — it's injected here, same as the Info.plist keys above.
      - name: Enable HealthKit entitlement
        run: |
          ENT="ios/App/App/App.entitlements"
          # PlistBuddy creates the file from scratch if it doesn't exist yet.
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.healthkit bool true" "$ENT" || true
          echo "--- App.entitlements ---"; cat "$ENT"
          if ! grep -q "CODE_SIGN_ENTITLEMENTS" ios/App/App.xcodeproj/project.pbxproj; then
            echo "::warning::No CODE_SIGN_ENTITLEMENTS build setting found in project.pbxproj — the entitlements file above may not be picked up at sign time, which would make HealthKit authorization fail on-device even though the build succeeds. If HealthKit sync doesn't work after install, this is the first thing to check."
          fi

      - name: Build unsigned .app (version stamped from package.json)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Building version $VERSION (build ${{ github.run_number }})"
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # xcodebuild ran with CODE_SIGNING_ALLOWED=NO, so nothing ever actually
      # codesigned the binary — the entitlements written into App.entitlements
      # above were sitting in the project but never embedded anywhere. SideStore
      # determines which capabilities to request from Apple by reading the
      # entitlements already present in the app it's re-signing, so an app with
      # zero embedded entitlements gets zero capabilities, no matter what's in
      # the (unused) entitlements file. Ad-hoc signing (identity "-", no
      # certificate needed) embeds the real entitlements so SideStore's re-sign
      # step has something to read and request a matching profile for.
      - name: Ad-hoc sign so SideStore can detect requested entitlements
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n1)
          codesign --force --deep --sign - --entitlements ios/App/App/App.entitlements "$APP"
          echo "--- embedded entitlements ---"
          codesign -d --entitlements :- "$APP"

      - name: Package into .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n1)
          echo "Found app: $APP"
          echo "Bundle version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r FitTrack-unsigned.ipa Payload >/dev/null
          ls -lh FitTrack-unsigned.ipa

      - name: Generate SideStore source.json
        run: |
          export GH_OWNER="${GITHUB_REPOSITORY%/*}"
          export GH_REPO="${GITHUB_REPOSITORY#*/}"
          export IPA_PATH="FitTrack-unsigned.ipa"
          node scripts/make-source.js
          cp icons/icon-512.png icon-512.png

      - name: Upload artifact (backup download)
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-ipa
          path: |
            FitTrack-unsigned.ipa
            sidestore/source.json
          if-no-files-found: error

      - name: Publish "latest" release (SideStore source lives here)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FitTrack latest
          files: |
            FitTrack-unsigned.ipa
            sidestore/source.json
            icon-512.png
